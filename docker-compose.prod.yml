services:
  postgres:
    image: postgres:16-alpine
    container_name: melosmarket-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: melosmarket-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      MELOSMARKET_JWT_SECRET: ${MELOSMARKET_JWT_SECRET}
      MELOSMARKET_TOKEN_VALIDITY_HOURS: ${MELOSMARKET_TOKEN_VALIDITY_HOURS:-24}
      MELOSMARKET_WORKER_REFERENCES_DIR: /app/uploads/worker-references
      MELOSMARKET_PROBLEM_IMAGES_DIR: /app/uploads/problem-images
      MELOSMARKET_CORS_ALLOWED_ORIGINS: ${MELOSMARKET_CORS_ALLOWED_ORIGINS:-https://melosmarket.hu,https://www.melosmarket.hu}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    volumes:
      - uploaded-files:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: melosmarket-frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2.9-alpine
    container_name: melosmarket-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-melosmarket.hu}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  uploaded-files:
  caddy-data:
  caddy-config:
