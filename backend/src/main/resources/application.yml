spring:
  application:
    name: melosmarket
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/melosmarket}
    username: ${SPRING_DATASOURCE_USERNAME:melosmarket}
    password: ${SPRING_DATASOURCE_PASSWORD:melosmarket}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

melosmarket:
  auth:
    jwt-secret: ${MELOSMARKET_JWT_SECRET:change-this-development-secret-at-least-32-characters}
    token-validity-hours: ${MELOSMARKET_TOKEN_VALIDITY_HOURS:24}
  cors:
    allowed-origins: ${MELOSMARKET_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  uploads:
    worker-references-dir: ${MELOSMARKET_WORKER_REFERENCES_DIR:uploads/worker-references}
    worker-profile-images-dir: ${MELOSMARKET_WORKER_PROFILE_IMAGES_DIR:uploads/worker-profile-images}
    problem-images-dir: ${MELOSMARKET_PROBLEM_IMAGES_DIR:uploads/problem-images}
  public-base-url: ${MELOSMARKET_PUBLIC_BASE_URL:http://localhost:5173}
  email:
    from: ${MELOSMARKET_EMAIL_FROM:melosmarket.hu@gmail.com}
    verification-valid-hours: ${MELOSMARKET_EMAIL_VERIFICATION_VALID_HOURS:24}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.SQL: warn
